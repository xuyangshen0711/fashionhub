<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Supplier Management - FashionHub</title>
    <link rel="stylesheet" href="css/suppliers.css" />
  </head>
  <body>
    <nav class="navbar">
      <h1>Supplier Management</h1>
      <div class="nav-links">
        <a href="../xuyang/dashboard.html">Dashboard</a>
        <a href="../xuyang/products.html">Products</a>
        <a href="../xuyang/employees.html">Employees</a>
        <a href="suppliers.html" class="active">Suppliers</a>
        <button onclick="logout()">Logout</button>
      </div>
    </nav>

    <div class="container">
      <div class="toolbar">
        <div class="filters">
          <select id="categoryFilter" onchange="loadSuppliers()">
            <option value="">All Categories</option>
            <option value="fabrics">Fabrics</option>
            <option value="accessories">Accessories</option>
            <option value="packaging">Packaging</option>
            <option value="manufacturing">Manufacturing</option>
          </select>

          <input
            id="searchInput"
            type="text"
            placeholder="Search suppliers..."
            oninput="debouncedSearch()"
          />
        </div>

        <button class="btn-add" onclick="openModal()">+ Add Supplier</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>Company</th>
            <th>Contact</th>
            <th>Phone</th>
            <th>Email</th>
            <th>Categories</th>
            <th>Rating</th>
            <th>Notes</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="suppliersBody"></tbody>
      </table>
    </div>

    <div class="modal" id="supplierModal">
      <div class="modal-content">
        <h2 id="modalTitle">Add Supplier</h2>

        <form id="supplierForm">
          <input type="hidden" id="supplierId" />

          <div class="form-group">
            <label>Company Name</label>
            <input type="text" id="companyName" required />
          </div>

          <div class="form-group">
            <label>Contact Person</label>
            <input type="text" id="contactPerson" />
          </div>

          <div class="form-group">
            <label>Phone</label>
            <input type="text" id="phone" />
          </div>

          <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" />
          </div>

          <div class="form-group">
            <label>Address</label>
            <input type="text" id="address" />
          </div>

          <div class="form-group">
            <label>Categories (comma separated)</label>
            <input type="text" id="categories" />
          </div>

          <div class="form-group">
            <label>Rating (1-5)</label>
            <select id="rating">
              <option value="5">5</option>
              <option value="4">4</option>
              <option value="3" selected>3</option>
              <option value="2">2</option>
              <option value="1">1</option>
            </select>
          </div>

          <div class="form-group">
            <label>Notes</label>
            <textarea id="notes"></textarea>
          </div>

          <div class="modal-actions">
            <button type="button" class="btn-cancel" onclick="closeModal()">
              Cancel
            </button>
            <button type="submit" class="btn-save">Save</button>
          </div>
        </form>
      </div>
    </div>

    <script src="js/suppliers.js"></script>
  </body>
</html>
