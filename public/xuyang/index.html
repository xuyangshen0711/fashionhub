<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FashionHub - Login</title>
    <link rel="stylesheet" href="css/index.css" />
  </head>
  <body>
    <div class="container">
      <h1>FashionHub</h1>
      <p class="subtitle">Product Catalog Management</p>

      <div class="tabs">
        <div class="tab active" onclick="showTab('login')">Login</div>
        <div class="tab" onclick="showTab('register')">Register</div>
      </div>

      <!-- Login Form -->
      <div class="form-container active" id="loginForm">
        <form onsubmit="handleLogin(event)">
          <div class="form-group">
            <label for="loginUsername">Username</label>
            <input
              type="text"
              id="loginUsername"
              placeholder="Enter your username"
              required
            />
          </div>
          <div class="form-group">
            <label for="loginPassword">Password</label>
            <input
              type="password"
              id="loginPassword"
              placeholder="Enter your password"
              required
            />
          </div>
          <button type="submit">Login</button>
          <div class="message" id="loginMessage"></div>
        </form>
      </div>

      <!-- Register Form -->
      <div class="form-container" id="registerForm">
        <form onsubmit="handleRegister(event)">
          <div class="form-group">
            <label for="regUsername">Username</label>
            <input
              type="text"
              id="regUsername"
              placeholder="Choose a username"
              required
            />
          </div>
          <div class="form-group">
            <label for="regEmail">Email</label>
            <input type="email" id="regEmail" placeholder="Enter your email" />
          </div>
          <div class="form-group">
            <label for="regPassword">Password</label>
            <input
              type="password"
              id="regPassword"
              placeholder="Choose a password"
              required
            />
          </div>
          <div class="form-group">
            <label for="regConfirm">Confirm Password</label>
            <input
              type="password"
              id="regConfirm"
              placeholder="Confirm your password"
              required
            />
          </div>
          <button type="submit">Register</button>
          <div class="message" id="registerMessage"></div>
        </form>
      </div>
    </div>

    <script>
      function showTab(tab) {
        document
          .querySelectorAll(".tab")
          .forEach((t) => t.classList.remove("active"));
        document
          .querySelectorAll(".form-container")
          .forEach((f) => f.classList.remove("active"));

        if (tab === "login") {
          document
            .querySelector(".tabs .tab:first-child")
            .classList.add("active");
          document.getElementById("loginForm").classList.add("active");
        } else {
          document
            .querySelector(".tabs .tab:last-child")
            .classList.add("active");
          document.getElementById("registerForm").classList.add("active");
        }
      }

      async function handleLogin(e) {
        e.preventDefault();
        const msgEl = document.getElementById("loginMessage");
        msgEl.className = "message";
        msgEl.style.display = "none";

        const username = document.getElementById("loginUsername").value;
        const password = document.getElementById("loginPassword").value;

        try {
          const res = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
          });

          const data = await res.json();

          if (res.ok) {
            localStorage.setItem("user", JSON.stringify(data));
            window.location.href = "dashboard.html";
          } else {
            msgEl.textContent = data.error || "Invalid username or password";
            msgEl.className = "message error";
            msgEl.style.display = "block";
          }
        } catch (err) {
          msgEl.textContent = "Connection error. Please try again.";
          msgEl.className = "message error";
        }
      }

      async function handleRegister(e) {
        e.preventDefault();
        const msgEl = document.getElementById("registerMessage");
        msgEl.className = "message";
        msgEl.style.display = "none";

        const username = document.getElementById("regUsername").value;
        const email = document.getElementById("regEmail").value;
        const password = document.getElementById("regPassword").value;
        const confirm = document.getElementById("regConfirm").value;

        if (password !== confirm) {
          msgEl.textContent = "Passwords do not match";
          msgEl.className = "message error";
          return;
        }

        try {
          const res = await fetch("/api/auth/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, email, password }),
          });

          const data = await res.json();

          if (res.ok) {
            msgEl.textContent = "Registration successful! Please login.";
            msgEl.className = "message success";
            setTimeout(() => showTab("login"), 1500);
          } else {
            msgEl.textContent = data.error || "Registration failed";
            msgEl.className = "message error";
          }
        } catch (err) {
          msgEl.textContent = "Connection error. Please try again.";
          msgEl.className = "message error";
        }
      }

      if (localStorage.getItem("user")) {
        window.location.href = "dashboard.html";
      }
    </script>
  </body>
</html>
